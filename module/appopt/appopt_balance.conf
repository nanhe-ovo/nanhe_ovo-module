# 南何ovo 线程调度 · 均衡档（balance）
# 引擎：AppOptR（作者 SutoLiu，GPL-3.0，https://gitee.com/sutoliu/AppOptR）
# 语义核：e-core 能效小核 / p-core 性能中核 / hp-core 高性能大核 / all-core 全部核心
# 语义说明：线程规则命中后按并集合并；未命中的线程回到包级默认，因此每个包必须保留默认行。
# 均衡策略：日常应用主线程中核、渲染大核；游戏默认中核、渲染借大核。

# ---------- 系统图形 ----------
surfaceflinger=all-core
surfaceflinger{RenderEngine}=hp-core

# ---------- 系统界面 ----------
com.android.systemui=p-core
com.android.systemui{RenderThread}=hp-core

# ---------- 社交与资讯 ----------
com.tencent.mm=p-core
com.tencent.mm{RenderThread}=hp-core
com.tencent.mm:push=e-core
com.tencent.mobileqq=p-core
com.tencent.mobileqq{RenderThread}=hp-core
com.tencent.mobileqq:MSF=e-core
com.ss.android.ugc.aweme=p-core
com.ss.android.ugc.aweme{RenderThread}=hp-core
com.taobao.taobao=p-core
com.taobao.taobao{RenderThread}=hp-core
com.eg.android.AlipayGphone=p-core
com.eg.android.AlipayGphone{RenderThread}=hp-core
com.autonavi.minimap=p-core
com.autonavi.minimap{RenderThread}=hp-core
com.coolapk.market=p-core
com.coolapk.market{RenderThread}=hp-core
com.bilibili.app.in=p-core
com.bilibili.app.in{RenderThread}=hp-core
com.netease.cloudmusic=e-core,p-core

