	UnityMain=hp-core
	UnityGfxDeviceW=hp-core
	RenderThread*=hp-core
	Thread-*=e-core,p-core
	Job.worker*=e-core,p-core
	FAsyncLoading=e-core
	AudioTrack=e-core
}
