com.autonavi.minimap=all-core
com.autonavi.minimap{RenderThread}=all-core
com.coolapk.market=all-core
com.coolapk.market{RenderThread}=all-core
com.bilibili.app.in=all-core
com.bilibili.app.in{RenderThread}=all-core
com.netease.cloudmusic=e-core,p-core

# ---------- Unity 引擎游戏（渲染固定大核，worker 中大核） ----------
