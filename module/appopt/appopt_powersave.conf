# 南何ovo 线程调度 · 省电档（powersave）
# 引擎：AppOptR（作者 SutoLiu，GPL-3.0，https://gitee.com/sutoliu/AppOptR）
# 语义核：e-core 能效小核 / p-core 性能中核 / hp-core 高性能大核 / all-core 全部核心
# 语义说明：线程规则命中后按并集合并；未命中的线程回到包级默认，因此每个包必须保留默认行。
# 省电策略：大核只留给渲染与主线程，其余线程压小核/中核；减少跨簇迁移，降低整机功耗。

# ---------- 系统图形 ----------
surfaceflinger=all-core
surfaceflinger{RenderEngine}=all-core

# ---------- 系统界面 ----------
com.android.systemui=e-core,p-core
com.android.systemui{RenderThread}=all-core

# ---------- 社交与资讯（主线程走中核，渲染走大核） ----------
com.tencent.mm=e-core,p-core
com.tencent.mm{RenderThread}=all-core
com.tencent.mm:push=e-core
com.tencent.mobileqq=e-core,p-core
com.tencent.mobileqq{RenderThread}=all-core
com.tencent.mobileqq:MSF=e-core
com.ss.android.ugc.aweme=e-core,p-core
com.ss.android.ugc.aweme{RenderThread}=all-core
com.taobao.taobao=e-core,p-core
com.taobao.taobao{RenderThread}=all-core
com.eg.android.AlipayGphone=e-core,p-core
com.eg.android.AlipayGphone{RenderThread}=all-core
com.autonavi.minimap=e-core,p-core
com.autonavi.minimap{RenderThread}=all-core
com.coolapk.market=e-core,p-core
com.coolapk.market{RenderThread}=all-core
com.bilibili.app.in=e-core,p-core
com.bilibili.app.in{RenderThread}=all-core
com.netease.cloudmusic=e-core

